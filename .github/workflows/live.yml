name: live

# Twenty minutes after each WINDFOR update: 03:30, 05:30, 08:30, 10:30, 12:30, 16:30, 19:30 and
# 23:30 UTC in summer, an hour later in winter.
on:
  schedule:
    - cron: "50 0,3,4,5,6,8,9,10,11,12,13,16,17,19,20,23 * * *"
  push:
    branches: [main]
    paths: [notebooks/explorer.py, notebooks/public/**, .github/workflows/live.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      issued: ${{ steps.commit.outputs.issued }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[tabpfn]"
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.day.outputs.day }}
          restore-keys: raw-
      - run: windpfn-live | tee live.log
        env:
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
      - id: commit
        run: |
          git add notebooks/public/live.csv
          if git diff --cached --quiet; then
            echo "issued=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "$(tail -n 1 live.log)"
            git push
            echo "issued=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: forecast
    if: always() && (github.event_name == 'push' || needs.forecast.outputs.issued == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "marimo==0.24.0" uv
      - run: marimo export html-wasm notebooks/explorer.py -o _site --mode run --no-sandbox
      - run: rm -f _site/*.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

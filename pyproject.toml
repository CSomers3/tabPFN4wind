[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windpfn"
version = "1.0.0"
description = "Day-ahead GB wind forecasts from TabPFN-3.5, scored against NESO's WINDFOR"
license = "MIT"
requires-python = ">=3.12"
# Pinned to the versions the held-out results were produced with.
dependencies = [
    "dynamical-catalog==1.0.1",
    "icechunk==2.1.2",
    "lightgbm==4.6.0",
    "matplotlib==3.9.1",
    "numpy==2.3.2",
    "pandas==2.2.2",
    "pyarrow==20.0.0",
    "pyproj==3.8.0",
    "requests==2.34.2",
    "scikit-learn==1.5.2",
    "xarray==2026.7.0",
    "zarr==3.3.0",
]

[project.optional-dependencies]
tabpfn = ["tabpfn-client==0.6.0"]
notebooks = ["marimo>=0.24.0"]

[project.scripts]
windpfn-sample = "windpfn.cli:sample"
windpfn-fetch = "windpfn.cli:fetch"
windpfn-backtest = "windpfn.cli:backtest"
windpfn-score = "windpfn.cli:score"
windpfn-page = "windpfn.cli:page"
windpfn-live = "windpfn.cli:live"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windpfn = ["fonts/*"]
